name: Build and Deploy

# Builds the Docker image on every push to master, pushes it to GHCR tagged
# with the full commit SHA, then bumps the image tag in the hintonweb-home/k8s-gitops
# repo (apps/pocketcasts/) so the cluster picks up the new build.
#
# This repo is a FORK of alansmodic/pocketcasts-mcp. The trigger below is
# deliberately just "push to master on this repo" — the default GitHub
# Actions trigger scope already excludes upstream pushes and PRs from forks
# of this fork; do not broaden this to pull_request or pull_request_target.
#
# The gitops bump authenticates as the GitHub App hintonweb-gitops-bot (Contents write on
# hintonweb-home/k8s-gitops only; org deploy keys are disabled). Org variable GITOPS_APP_ID and
# org secret GITOPS_APP_PRIVATE_KEY are shared with this repo; each run mints a one-hour token.

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/hintonweb-home/pocketcasts-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged with the full commit SHA (not shortened) for an
          # unambiguous, reproducible reference in the GitOps repo.
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mint a k8s-gitops token
        uses: actions/create-github-app-token@v2
        id: gitops-token
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: hintonweb-home
          repositories: k8s-gitops

      - name: Checkout k8s-gitops
        uses: actions/checkout@v4
        with:
          repository: hintonweb-home/k8s-gitops
          ref: master
          token: ${{ steps.gitops-token.outputs.token }}
          path: k8s-gitops

      - name: Bump image tag
        working-directory: k8s-gitops/apps/pocketcasts
        run: |
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push
        working-directory: k8s-gitops
        run: |
          git config user.name "hintonweb-gitops-bot[bot]"
          git config user.email "356625472+hintonweb-gitops-bot[bot]@users.noreply.github.com"
          git add apps/pocketcasts
          git diff --cached --quiet && { echo "tag already current"; exit 0; }
          git commit -m "deploy pocketcasts-mcp@${{ github.sha }}"
          for i in 1 2 3; do git pull --rebase -q origin master && git push origin HEAD:master && exit 0; sleep 5; done
          exit 1
